name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Copy web build to Android assets
        run: |
          mkdir -p assets/native/android/app/src/main/assets/www
          cp -r dist/* assets/native/android/app/src/main/assets/www/

      - name: Setup Gradle project
        working-directory: assets/native/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Create gradle wrapper
          cat > settings.gradle << 'GRADLE'
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories { google(); mavenCentral() }
}
include ':app'
rootProject.name = "QuranHadith"
GRADLE

          cat > build.gradle << 'GRADLE'
plugins {
    id 'com.android.application' version '8.1.0' apply false
}
GRADLE

          cat > app/build.gradle << 'GRADLE'
plugins { id 'com.android.application' }
android {
    namespace 'com.birrstack.quranhadith'
    compileSdk 34
    defaultConfig {
        applicationId "com.birrstack.quranhadith"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.10.0' }
GRADLE

          mkdir -p app/src/main/java/com/birrstack/quranhadith
          cat > app/src/main/java/com/birrstack/quranhadith/MainActivity.java << 'JAVA'
package com.birrstack.quranhadith;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebSettings;
public class MainActivity extends Activity {
    private WebView webView;
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setMediaPlaybackRequiresUserGesture(false);
        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("file:///android_asset/www/index.html");
    }
    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
JAVA

          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application android:label="Quran Hadith" android:icon="@android:drawable/ic_dialog_info" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
    <uses-permission android:name="android.permission.INTERNET" />
</manifest>
MANIFEST

          # Generate gradle wrapper
          gradle wrapper --gradle-version 8.1

      - name: Build APK
        working-directory: assets/native/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-hadith-apk
          path: assets/native/android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: assets/native/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
